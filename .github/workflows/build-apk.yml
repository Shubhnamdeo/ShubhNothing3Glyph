name: Build & Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses & Configure local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
        chmod +x gradlew

    - name: Build Debug APK
      run: |
        set -o pipefail
        ./gradlew assembleDebug --stacktrace

    - name: Copy & Rename APK
      run: |
        find app/build/outputs/apk -name "*.apk" -exec cp {} ShubhNothing3Glyph.apk \;
        ls -la ShubhNothing3Glyph.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ShubhNothing3Glyph-APK
        path: ShubhNothing3Glyph.apk

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      continue-on-error: true
      with:
        tag_name: v1.0.0
        name: Shubh Glyph Suite v1.0.0
        body: |
          ### 📱 Shubh Glyph Suite for Nothing Phone (3)
          Freshly built and signed APK ready for installation on your device.
          
          **How to install on phone:**
          1. Tap on `ShubhNothing3Glyph.apk` under **Assets** below.
          2. Open the downloaded file on your Nothing Phone and tap **Install**.
        files: ShubhNothing3Glyph.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
